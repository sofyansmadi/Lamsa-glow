# Every 6 hours, pull the catalog from Shopify. If products, prices or photos changed,
# commit the new snapshot; Cloudflare sees the push and redeploys the site. No secrets needed.
name: Refresh products
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/sync-catalog.mjs
      - name: Commit if the catalog changed
        run: |
          if git diff --quiet data/catalog.json; then echo "No changes."; exit 0; fi
          git config user.name "lamsa-bot"
          git config user.email "lamsa-bot@users.noreply.github.com"
          git commit -am "Refresh catalog from Shopify"
          git push
