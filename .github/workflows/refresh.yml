# Rebuilds the site on Cloudflare Pages every 6 hours so new products, prices and photos
# from Shopify show up without a code change. Needs one repo secret: CF_DEPLOY_HOOK
# (Cloudflare Pages > your project > Settings > Builds > Deploy hooks).
name: Refresh products
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Cloudflare Pages build
        env:
          HOOK: ${{ secrets.CF_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then echo "CF_DEPLOY_HOOK not set yet, skipping."; exit 0; fi
          curl -fsS -X POST "$HOOK"
